# Optional PostgreSQL for PoraBondhu (SQLite is used when PB_DATABASE_URL is empty).
#   docker compose up -d db
#   set PB_DATABASE_URL=postgresql+psycopg2://porabondhu:porabondhu@localhost:5432/porabondhu
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: porabondhu
      POSTGRES_PASSWORD: porabondhu
      POSTGRES_DB: porabondhu
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
